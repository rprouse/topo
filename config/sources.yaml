# Every data source the pipeline may use: where it comes from, how it is
# fetched, its licence, and the attribution it requires. The attribution
# block printed in the collar is generated from this file - don't hand-edit
# attribution anywhere else.
#
# `verified` records when the endpoint, format and licence were last checked
# by hand. A source with `verified: null` has not been checked yet and its
# fetcher is not implemented; the fetch stage skips it with a warning.
#
# Never add Trailforks data, or Google / Esri / Bing imagery or tiles.

licences:
  ogl-bc:
    name: Open Government Licence - British Columbia
    url: https://www2.gov.bc.ca/gov/content/data/open-data/open-government-licence-bc
    attribution: >-
      Contains information licensed under the Open Government Licence -
      British Columbia.
  ogl-canada:
    name: Open Government Licence - Canada
    url: https://open.canada.ca/en/open-government-licence-canada
    attribution: >-
      Contains information licensed under the Open Government Licence -
      Canada.
  odbl:
    name: Open Database License (ODbL) 1.0
    url: https://www.openstreetmap.org/copyright
    attribution: >-
      Map data © OpenStreetMap contributors. Available under the Open
      Database License (ODbL) from openstreetmap.org/copyright.

sources:
  # ---- Vectors: BC Freshwater Atlas (via BC Data Catalogue WFS) -----------
  fwa_streams:
    title: BC Freshwater Atlas - Stream Network
    kind: wfs
    group: water
    endpoint: https://openmaps.gov.bc.ca/geo/pub/wfs
    layer: pub:WHSE_BASEMAPPING.FWA_STREAM_NETWORKS_SP
    native_crs: EPSG:3005
    sort_by: OBJECTID
    page_size: 10000          # server CountDefault is 10000
    licence: ogl-bc
    credit: Province of British Columbia
    verified: 2026-11-22

  fwa_lakes:
    title: BC Freshwater Atlas - Lakes
    kind: wfs
    group: water
    endpoint: https://openmaps.gov.bc.ca/geo/pub/wfs
    layer: pub:WHSE_BASEMAPPING.FWA_LAKES_POLY
    native_crs: EPSG:3005
    sort_by: OBJECTID
    page_size: 10000
    licence: ogl-bc
    credit: Province of British Columbia
    verified: 2026-11-22

  fwa_rivers:
    title: BC Freshwater Atlas - Rivers
    kind: wfs
    group: water
    endpoint: https://openmaps.gov.bc.ca/geo/pub/wfs
    layer: pub:WHSE_BASEMAPPING.FWA_RIVERS_POLY
    native_crs: EPSG:3005
    sort_by: OBJECTID
    page_size: 10000
    licence: ogl-bc
    credit: Province of British Columbia
    verified: 2026-11-22

  fwa_wetlands:
    title: BC Freshwater Atlas - Wetlands
    kind: wfs
    group: water
    endpoint: https://openmaps.gov.bc.ca/geo/pub/wfs
    layer: pub:WHSE_BASEMAPPING.FWA_WETLANDS_POLY
    native_crs: EPSG:3005
    sort_by: OBJECTID
    page_size: 10000
    licence: ogl-bc
    credit: Province of British Columbia
    verified: 2026-11-22

  # ---- Not yet verified / implemented (later milestones) -----------------
  # ---- Terrain (priority order is terrain.sources in map.yaml) ------------
  # LidarBC publishes its tile index as an ArcGIS feature service; each tile
  # record has an s3Url to a 1 m bare-earth DEM GeoTIFF in NAD83(CSRS) UTM.
  # The index description states the data is released under the Open
  # Government Licence - BC. Tiles are downloaded whole: the 2022 tiles are
  # strip-organised (not COGs) and remote windowed reads proved unreliable.
  # Several survey years overlap, each with partial coverage; newest wins.
  lidarbc_dem:
    title: LidarBC bare-earth DEM (1 m)
    kind: lidarbc
    group: terrain
    endpoint: https://services6.arcgis.com/ubm4tcTYICKBpist/arcgis/rest/services/LiDAR_BC_S3_Public/FeatureServer
    portal: https://lidar.gov.bc.ca/
    index_layers:
      5: DEM 1:2,500 grid
      6: DEM 1:20,000 grid
    max_year: null            # pin to e.g. 2024 to ignore newer surveys
    resample: average         # 1 m -> working grid
    licence: ogl-bc
    credit: Province of British Columbia (LidarBC)
    verified: 2026-11-22

  # NRCan HRDEM 2 m mosaic, COGs on S3 found through the datacube STAC API.
  # Read with windowed requests; only the gap area is pulled.
  hrdem:
    title: NRCan HRDEM Mosaic (2 m)
    kind: stac_cog
    group: terrain
    endpoint: https://datacube.services.geo.ca/stac/api/
    collection: hrdem-mosaic-2m
    asset: dtm
    resample: bilinear
    licence: ogl-canada
    credit: Natural Resources Canada
    verified: 2026-11-22

  # CDEM (16 m here) is the brief's last resort. NRCan now also publishes
  # MRDEM-30 (collection mrdem-30, asset dtm) as its successor; switch the
  # collection here if CDEM is retired.
  cdem:
    title: NRCan Canadian Digital Elevation Model (CDEM)
    kind: stac_cog
    group: terrain
    endpoint: https://datacube.services.geo.ca/stac/api/
    collection: cdem
    asset: dem
    resample: cubic
    # CDEM stores whole metres; at 2 m every 1 m step shows as a terrace in
    # the hillshade. Smooth it before it fills gaps. (MRDEM-30 was tried as
    # an alternative: smoother but coarser, with pits and bumps.)
    smooth_sigma_m: 12
    licence: ogl-canada
    credit: Natural Resources Canada
    verified: 2026-11-22

  # OpenStreetMap through the Overpass API, AOI only. The snapshot date is
  # set by osm.snapshot in map.yaml (Overpass answers from its history for a
  # pinned date). Geofabrik's BC extract was the alternative, but it only
  # serves "latest", so it can't be pinned.
  osm:
    title: OpenStreetMap
    kind: overpass
    group: vectors
    endpoint: https://overpass-api.de/api/interpreter
    route_types: [hiking, foot, mtb, bicycle, ski, piste]
    licence: odbl
    credit: OpenStreetMap contributors
    verified: 2026-11-22

  # Official names: Canadian Geographical Names (federal, includes BC's
  # official names), OGL-Canada.
  cgn_names:
    title: Canadian Geographical Names
    kind: geonames
    group: names
    endpoint: https://geogratis.gc.ca/services/geoname/en/geonames.json
    licence: ogl-canada
    credit: Natural Resources Canada
    verified: 2026-11-22

  # NOT USED - licence. The BC Data Catalogue lists these as "Access Only":
  # the Province's copyright terms say reproduction is not permitted without
  # written permission (request form: https://forms.gov.bc.ca/copyright-permission-request/).
  #   - BC Digital Road Atlas (WHSE_BASEMAPPING.DRA_DGTL_ROAD_ATLAS_MPAR_SP)
  #   - Forest Tenure road sections (WHSE_FOREST_TENURE.FTEN_ROAD_SECTION_LINES_SVW)
  #   - BC Geographical Names / BCGNWS (WHSE_BASEMAPPING.GNS_GEOGRAPHICAL_NAMES_SP)
  # Open alternatives checked: CGN (used, above) for names. For roads, CanVec
  # transport (OGL-Canada) was examined and rejected: in this AOI it is mostly
  # town streets, has almost no resource roads, and dates from 1997-2017.
  # Roads therefore come from OSM only.

  declination:
    title: NRCan Magnetic Declination Calculator
    kind: geomag
    group: collar
    endpoint: https://geomag.nrcan.gc.ca/
    licence: ogl-canada
    credit: Natural Resources Canada
    verified: null            # milestone 4
