# Map parameters. Everything the pipeline needs to know about *what* map to
# make lives here; changing these and rebuilding must not need code changes.

name: fernie
title: Fernie
edition: "2027.1"

# NAD83(CSRS) / UTM zone 11N. Verified against the EPSG registry (and checked
# at runtime by `pipeline config`, which prints the CRS name GDAL resolves).
crs: EPSG:2955

# Map scale denominator. 25000 is the target; 30000 must also work.
scale: 25000

# Area of interest, centred on Fernie's town centre (lon, lat in WGS84).
# With sheet.grid below, the AOI is the union of the map faces; without it,
# set width_m / height_m here and list the sides explicitly.
aoi:
  center: [-115.063, 49.504]
  # Shift of the whole map set from that centre, in metres [east, north].
  # 2.5 km west puts more of the useful country west of town on sheet E.
  offset_m: [-2500, 0]
  # Extra margin fetched around the AOI so contours, hillshade and lines
  # don't stop abruptly at the neatline.
  buffer_m: 1000

# Sheet and faces. The map set is a grid of faces, each printed on one
# side of a 24 x 36 in sheet, read left to right, top to bottom: A B C /
# D E F / G H I, with Fernie in the centre face (E). Neighbouring faces
# repeat overlap_m along their shared edge so nothing falls on a seam.
# An overview of the whole set is printed on the tenth face (overview: true).
# Duplex pairs, in sheet.pdf order: A|B, C|D, E|F, G|H, I|overview.
#
# A face is at most ~14.8 x 21.1 km at 1:25,000 on this sheet (the map frame
# must leave room for the title band and collar).
# (Alternative to `grid`: an explicit `sides:` list of {id, title, extent},
# where extent is full/west/east/north/south of the AOI or [xmin, ymin,
# xmax, ymax], with aoi.width_m / height_m set.)
sheet:
  width_in: 24
  height_in: 36
  orientation: portrait
  grid:
    rows: 3
    columns: 3
    face_width_m: 14000
    face_height_m: 21000
    overlap_m: 1000
    ids: [A, B, C, D, E, F, G, H, I]     # default
    titles: {A: Tanglefoot, B: Mount Washburn, C: Sparwood, D: Island Lake, E: Fernie, F: Coal Creek, G: Jaffray, H: Elko, I: Flathead}                  # default: compass names, centre = title
  overview: true

terrain:
  # Terrain sources in order of preference. The fetch stage takes the first
  # source that has data for each part of the AOI and fills gaps from the
  # next one down. "source:YEAR" restricts an entry to one survey year, so
  # years from different sources can be interleaved.
  #
  # LidarBC's 2016 tiles contain TIN-interpolated fans beyond the real survey
  # coverage, reported as valid data, and LidarBC publishes no footprint to
  # mask them with. NRCan's HRDEM mosaic holds the same 2016 survey (plus a
  # 2023 one) clipped to the real coverage, so LidarBC 2016 is left out: below
  # HRDEM it would only add the fans. Areas no lidar survey covers fall
  # through to the national DEM.
  # The 2017 East Kootenay survey is treated like 2016: NRCan's mosaic carries
  # it clipped to its real coverage.
  sources: [lidarbc_dem:2025, lidarbc_dem:2024, lidarbc_dem:2022, hrdem, cdem]
  dem_resolution_m: 2        # working DEM grid; 300 dpi at 1:25,000 is ~2.1 m
  # Gaps smaller than this are interpolated instead of fetching another
  # source for them (lidar DEMs often have small voids on water).
  min_fill_area_m2: 400
  fill_max_distance_m: 50    # max distance to interpolate across voids

  contour_interval_m: 20     # 10 must also work
  index_every: 5             # every 5th contour is an index line (100 m at 20 m)
  smoothing_sigma_m: 6       # Gaussian smoothing applied before contouring
  contour_simplify_m: 1.0    # Douglas-Peucker tolerance before/after smoothing
  contour_smooth_iterations: 2  # Chaikin corner-cutting passes
  contour_min_length_m: 60   # drop closed contours shorter than this (noise)

  hillshade_resolution_m: 2  # print-resolution hillshade (2-5 m)
  hillshade_azimuth: 315
  hillshade_altitude: 45
  hillshade_z_factor: 1.0
  multidirectional: false

  # Spot-height candidates from DEM summits. The vectors stage (milestone 3)
  # drops those near named OSM/BCGNIS peaks and applies spot_heights_max.
  spot_heights_max: 40       # per sheet
  spot_height_radius_m: 400  # a summit must be the highest point within this
  spot_height_min_relief_m: 60

  preview_dpi: 100           # PNG preview of hillshade + contours

grid:
  spacing_m: 1000

# OpenStreetMap snapshot. A date (YYYY-MM-DD) pins the edition: Overpass
# returns OSM as it was at 00:00 UTC that day, so rebuilding gives the same
# data. "latest" uses the live database (refreshed at most once a day).
# For a new edition, move the date forward and read the QA change report.
osm:
  snapshot: "2026-11-25"

vectors:
  osm_mapping: config/osm_mapping.yaml      # OSM tags -> layers and classes
  corrections: authored/corrections.gpkg    # hand-made fixes, applied last
  # OSM peaks and places are compared with official names (Canadian
  # Geographical Names) of these kinds: first by name within name_radius_m,
  # then by proximity within radius_m. OSM names are kept; every difference
  # is listed in vectors-report.json to settle with a correction.
  name_match:
    peak: {concise: [MTN], radius_m: 750, name_radius_m: 5000}
    place: {concise: [CITY, TOWN, VILG, HAM, UNP, LOCL], radius_m: 2500, name_radius_m: 5000}
  # Spot heights are dropped within this distance of a known peak.
  spot_height_exclude_radius_m: 400

# Print layout. The collar is generated at render time from these values;
# the map frame is each side's extent at `scale`. The legend is a box drawn
# over the map in `legend_corner` (there is little room around a 24x36 face).
layout:
  page_margin_mm: 8
  title_band_mm: 14      # above the map frame
  collar_band_mm: 40     # below the map frame
  legend_corner: bottom_left
  pdf_dpi: 300           # raster resolution (hillshade) in the print PDF
  lossless_images: true  # QGIS otherwise embeds rasters as JPEG
  preview_dpi: 50        # PNG previews

# Print deliverables. QGIS 3.44 (Qt5) cannot write CMYK PDFs; the print PDFs
# are RGB. Most digital printers convert RGB themselves with their own
# profile and black handling: send them the RGB PDF unless they ask for CMYK.
# cmyk: true adds side-<id>-cmyk.pdf, converted by Ghostscript with
# icc_profile (the printer's output profile; null = Ghostscript's generic
# default_cmyk.icc). Caveat: black text and lines become 4-colour "rich
# black" in that conversion. See docs/print.md.
print:
  cmyk: false
  icc_profile: null

# Digital edition: georeferenced PDF (GeoPDF) per side, for apps such as
# Avenza Maps. Georeferenced to the map frame; lighter than the print PDF.
digital:
  geopdf: true
  dpi: 200
  include_features: false   # embed the map features as queryable layers (+25% size)

# Proof tiles for an office printer: each side at 100% scale, cut into
# letter / legal pages with overlap and crop marks, plus an index page.
proofs:
  papers: [letter, legal]
  margin_mm: 8        # keep clear of the printer's unprintable edge
  overlap_mm: 12      # each tile repeats this much of its neighbours
  greyscale: true     # also a greyscale set (does the map read without colour?)

# QA report. The change report compares build/map.gpkg with this baseline:
# by default the map from the previous vectors build. To compare with a
# released edition, point it at the release archive, e.g.
# releases/2027.1/map.gpkg (see docs/PROCESS.md, "Making a new edition").
qa:
  baseline: build/map.previous.gpkg
  change_layers: [roads, trails, pois, places]
  moved_threshold_m: 25          # report a point that moved further than this
  length_change_threshold: 0.10  # report a line whose length changed by more than 10%

collar:
  # Magnetic declination at the map centre, from the high-resolution World
  # Magnetic Model (WMMHR-2025, valid to 2030), computed for this date. Use the date the
  # edition is meant for, so a rebuild prints the same value.
  declination_date: "2027-01-01"
  disclaimer: >-
    This map is a guide only. We do not warrant its accuracy nor do we guarantee its
    completeness. Roads and trails may change and may no longer be passable. Conditions
    and map features change. Users are responsible for their own safety. Therefore they
    should exercise caution and use their own judgment when planning routes and
    navigating the terrain. Travel on resource roads and trails is inherently risky and
    users must exercise caution and follow all applicable regulations.
